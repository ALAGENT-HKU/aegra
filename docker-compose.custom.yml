services:
  # PostgreSQL database for LangGraph and metadata
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aegra
    ports:
      - "${PG_PORT:-5442}:5432" # 外部端口，可通过 PG_PORT 修改避免冲突
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d aegra" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aegra Server
  aegra:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    user: "0:0" # Run as root to install dependencies
    ports:
      - "0.0.0.0:${PORT:-2024}:${PORT:-2024}" # 绑定到所有网络接口，内网可访问
    extra_hosts:
      - "host.docker.internal:host-gateway" # 允许容器访问主机服务
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
      chrome:
        condition: service_started
    volumes:
      - ./aegra.docker.json:/app/aegra.json:ro # 使用 Docker 专用配置
      - ./libs/aegra-api/src:/app/src:ro # Mount full src for PYTHONPATH and hot reload
      - ./libs/aegra-api/alembic:/app/alembic:ro # for migrations
      - ./examples:/app/examples:ro
      - ./auth.py:/app/auth.py:ro
      - ./.env:/app/.env:ro
      # Mount quantitative_strategy_agent for graph loading (relative: ../qsa from aegra/)
      - ../quantitative_strategy_agent:/app/quantitative_strategy_agent
      # Mount data directories for persistence (relative: ../data from aegra/)
      - ../data:/app/data
      # Mount logs directory for persistence
      - ./logs:/app/logs # 持久化日志文件
      # DinD: 挂载 Docker socket，允许容器内调用 Docker API
      - /var/run/docker.sock:/var/run/docker.sock
      - ${GCP_ADC_PATH:-/dev/null}:/app/gcp_credentials.json:ro
      # Browser profile persistence (cookies, localStorage, extensions)
      - browser_profile:/app/data/browser_profile
    # GPU passthrough for embedding model acceleration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      sh -c "
        echo 'Installing QSA package (editable, no deps - deps already in image via uv.lock)...' &&
        pip install --no-deps -e /app/quantitative_strategy_agent 2>/dev/null;
        echo 'Installing additional runtime dependencies...' &&
        pip install stripe socksio 2>/dev/null;
        echo 'Running database migrations...' &&
        alembic upgrade head &&
        echo 'Starting Aegra server...' &&
        if [ \"$${UVICORN_RELOAD:-false}\" = \"true\" ]; then
          uvicorn aegra_api.main:app --host 0.0.0.0 --port $${PORT:-2024} --reload \
            --reload-dir /app/src \
            --reload-dir /app/quantitative_strategy_agent \
            --reload-exclude '*.pyc' \
            --reload-exclude '*.pyo' \
            --reload-exclude '*/__pycache__/*' \
            --reload-exclude '*/.pytest_cache/*' \
            --reload-exclude '*/.mypy_cache/*' \
            --reload-exclude '*/.ruff_cache/*' \
            --reload-exclude '*/.git/*' \
            --reload-exclude '*/.venv/*' \
            --reload-exclude '*/site-packages/*' \
            --reload-exclude '*/dist/*' \
            --reload-exclude '*/build/*' \
            --reload-exclude '*/.egg-info/*';
        else
          uvicorn aegra_api.main:app --host 0.0.0.0 --port $${PORT:-2024};
        fi
      "

  # Redis (optional - for advanced queuing in future phases)
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    profiles:
      - redis

  # Chrome sidecar for Browser Agent (browser-use connects via CDP)
  # Always started — aegra depends on it for browser-agent research
  chrome:
    image: browserless/chrome:latest
    ports:
      - "${BROWSER_CDP_PORT:-9222}:3000"
    environment:
      - MAX_CONCURRENT_SESSIONS=${BROWSER_MAX_CONCURRENT:-3}
      - CONNECTION_TIMEOUT=300000
      - TIMEOUT=300000
    deploy:
      resources:
        limits:
          memory: ${BROWSER_MEMORY_LIMIT:-8g}

  # GPU is disabled by default for portable deployment.
  # Add a GPU override file on hosts that require embedding acceleration.

volumes:
  postgres_data:
  redis_data:
  browser_profile:
  
networks:
  default:
    name: alagent_network
    external: true
