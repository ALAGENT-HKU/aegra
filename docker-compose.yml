services:
  # PostgreSQL database for LangGraph and metadata
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5442:5432" # 外部端口 5442，避免与 Langfuse 冲突
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aegra Server
  aegra:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-2026}:${PORT:-2026}"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - PYTHONPATH=/app/src:/app/quantitative_strategy_agent
      - PYTHONDONTWRITEBYTECODE=1
      - BASE_DATA_DIR=/app/data
      - WORKSPACE_DIR=/app/data/workspace
      - MEMORIES_DIR=/app/data/memories
      - PERSIST_DIR=/app/data/database
      - HF_HOME=/app/data/.cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/app/data/.cache/torch/sentence_transformers
      - TORCH_HOME=/app/data/.cache/torch
      - PERSIST_DIR=/app/data/database
      - REDIS_URL=${REDIS_URL:-redis://host.docker.internal:6379/0}
    networks:
      - default
      - chatnio_chatnio-network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./aegra.json:/app/aegra.json:ro
      - ../quantitative_strategy_agent/vnlp:/app/vnlp:ro
      - ./examples:/app/examples:ro
      - ./libs/aegra-api/src:/app/src:ro  # Mount full src for PYTHONPATH to work
      - ./libs/aegra-api/alembic:/app/alembic:ro # for migrations
      - ./.env:/app/.env:ro
      - ./auth.py:/app/auth.py:ro  # Custom auth handler
      - ./logs:/app/logs  # Log files (when LOG_TO_FILE=true)
      - ../data:/app/data  # Shared data dir (workspace, memories, database)
      # QSA graph mount (override AEGRA_CONFIG or aegra.json to use)
      - ${QSA_PATH:-./examples}:/app/quantitative_strategy_agent:ro
    command: >
      sh -c "
        echo 'Running database migrations...' &&
        alembic upgrade head &&
        echo 'Starting Aegra server...' &&
        if [ \"$${UVICORN_RELOAD:-false}\" = \"true\" ]; then
          uvicorn aegra_api.main:app --host 0.0.0.0 --port $${PORT:-2026} --reload \
            --reload-exclude '*.pyc' \
            --reload-exclude '*.pyo' \
            --reload-exclude '*/__pycache__/*' \
            --reload-exclude '*/.pytest_cache/*' \
            --reload-exclude '*/.mypy_cache/*' \
            --reload-exclude '*/.ruff_cache/*' \
            --reload-exclude '*/.git/*' \
            --reload-exclude '*/.venv/*' \
            --reload-exclude '*/site-packages/*' \
            --reload-exclude '*/dist/*' \
            --reload-exclude '*/build/*' \
            --reload-exclude '*/.egg-info/*';
        else
          uvicorn aegra_api.main:app --host 0.0.0.0 --port $${PORT:-2026};
        fi
      "

  # Redis (optional - for advanced queuing in future phases)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    profiles:
      - redis

volumes:
  postgres_data:
  redis_data:

networks:
  default: {}
  chatnio_chatnio-network:
    external: true
